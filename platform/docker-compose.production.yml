services:
  db:
    stop_grace_period: 60s
    mem_limit: 8g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  api:
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 330s
    mem_limit: 6g
    cpus: 3.0
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  worker:
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 330s
    mem_limit: 6g
    cpus: 3.0
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  web:
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
