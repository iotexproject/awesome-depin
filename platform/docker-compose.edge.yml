services:
  edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
    restart: unless-stopped
    environment:
      QTAIL_DOMAIN: ${QTAIL_DOMAIN:-localhost}
    ports:
      - "${EDGE_BIND_HOST:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${EDGE_BIND_HOST:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - qtail_caddy_data:/data
      - qtail_caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test \"$(wget -qO- http://127.0.0.1:8081/healthz)\" = ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  qtail_caddy_data:
  qtail_caddy_config:
