limit_req_zone $binary_remote_addr zone=qtail_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=qtail_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=qtail_admin:10m rate=60r/m;

# Docker may assign the API container a new address after a restart. Resolve the
# service name through Docker's embedded DNS for every request window instead
# of pinning the address when Nginx starts.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;
  limit_req_status 429;
  set $api_origin http://api:8787;

  # Flask emits the same baseline headers for direct/API responses. Hide the
  # upstream copies so Nginx produces one canonical value instead of duplicate
  # security header fields.
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Browsers honor HSTS only over HTTPS. This lets both Caddy and Cloudflare
  # ingress enforce the same policy while remaining harmless on local HTTP.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

  location ~ ^/api/auth/(login|register)$ {
    limit_req zone=qtail_auth burst=10 nodelay;
    proxy_pass $api_origin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /api/admin/ {
    limit_req zone=qtail_admin burst=30 nodelay;
    proxy_pass $api_origin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /api/ {
    limit_req zone=qtail_api burst=60 nodelay;
    proxy_pass $api_origin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /downloads/ {
    proxy_pass $api_origin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # The SPA page and the public evidence artifact directory intentionally share
  # the /evidence prefix. Exact page routes must not be canonicalized as a
  # filesystem directory by Nginx.
  location = /evidence {
    try_files /index.html =404;
  }

  location = /evidence/ {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
